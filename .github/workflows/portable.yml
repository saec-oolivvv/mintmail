name: Moteur sur 3 systèmes
# Portage Windows / macOS : le moteur (courrier, cache, IA, synchro…) doit tourner à l'identique sur les trois systèmes.
# Windows et macOS n'empêchent pas la fusion tant qu'ils ne sont pas verts (continue-on-error) ; Linux, lui, doit toujours l'être.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tests/run_core.py
