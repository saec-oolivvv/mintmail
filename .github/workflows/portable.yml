name: Moteur sur 3 systèmes
# Portage Windows / macOS : le moteur (courrier, cache, IA, synchro…) doit tourner à l'identique sur les trois systèmes.
# Windows et macOS n'empêchent pas la fusion tant qu'ils ne sont pas verts (continue-on-error) ; Linux, lui, doit toujours l'être.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tests/run_core.py

  qt:
    # Interface Qt (PySide6) : la fenêtre se construit sans écran, liste les messages et ouvre un message dans le lecteur.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow PySide6
      - name: Dépendances graphiques Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libnss3 libxcb-cursor0
      - run: python tests/run_core.py
        env:
          QT_QPA_PLATFORM: offscreen
