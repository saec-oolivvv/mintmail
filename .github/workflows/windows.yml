name: Application Windows
# Construit MintMail-<version>-windows-x64.zip (portable) et -setup.exe (installateur Inno Setup) sur un Windows hébergé par GitHub : à la main
# (Actions → Application Windows → Run workflow) et à la publication d'une Release (fichiers joints). EXPÉRIMENTAL, non signé.
on:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Construire
        shell: pwsh
        run: |
          pwsh -File packaging/build-windows.ps1 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Journal de construction (utile en cas d'échec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: MintMail-windows
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
      - name: Joindre à la Release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip dist/*.zip.sha256 dist/*-setup.exe dist/*-setup.exe.sha256 --clobber
