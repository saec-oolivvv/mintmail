name: Application macOS
# Construit MintMail-<version>-macos-<arch>.dmg (+ .sha256) sur des Mac hébergés par GitHub, pour Apple Silicon (arm64) ET Intel (x86_64) :
# à la main (Actions → Application macOS → Run workflow) et automatiquement à la publication d'une Release, où les fichiers sont joints
# (la mise à jour intégrée de MintMail les y cherche). Non signé par Apple : clic droit → Ouvrir au premier lancement.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette d'une Release existante (ex. v1.41.1) : construit CETTE version et joint les .dmg à la Release (facultatif)"
        required: false
  release:
    types: [published]
permissions:
  contents: write
jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15            # Apple Silicon (macos-14 : « configuration not supported » le 17/11/2026)
          - runner: macos-15-intel      # Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Certificat Apple (facultatif)
        # Actif seulement si les secrets existent (Settings → Secrets → Actions) : MACOS_CERT_P12 (certificat « Developer ID Application » .p12 en base64),
        # MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY ; pour la notarisation en plus : APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD. Sans eux : signature ad hoc.
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -n "$CERT_P12" ]; then
            KC="$RUNNER_TEMP/mintmail.keychain-db"; KCPW="$(uuidgen)"
            echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KCPW" "$KC"
            security set-keychain-settings -lut 21600 "$KC"
            security unlock-keychain -p "$KCPW" "$KC"
            security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" login.keychain-db
            rm -f "$RUNNER_TEMP/cert.p12"
            echo "Certificat Apple importé."
          else
            echo "Pas de certificat Apple : signature ad hoc."
          fi
      - name: Construire le .dmg
        shell: bash
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -o pipefail
          sh packaging/build-macos.sh 2>&1 | tee build.log
      - name: Journal de construction (utile en cas d'échec)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.runner }}
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: MintMail-macos-${{ matrix.runner }}
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
      - name: Joindre à la Release
        if: github.event_name == 'release' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" dist/*.dmg dist/*.dmg.sha256 --clobber
